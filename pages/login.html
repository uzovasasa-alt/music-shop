<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — «Мелодия»</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="site-header">
        <a href="../index.html" class="site-header__logo">Мелодия</a>

        <nav class="site-header__nav" aria-label="Основная навигация">
            <a href="../index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="product.html">Товар</a>
            <a href="registration.html">Регистрация</a>
            <a href="login.html" aria-current="page">Вход</a>
            <a href="order.html">Оформление заказа</a>
            <a href="../index.html#site-footer">Контакты</a>
        </nav>
    </header>
    <main class="form-page">
        <h1>Вход</h1>
        <p class="form-page__lead">
            Войдите в аккаунт, чтобы видеть историю заказов и быстрее оформлять новые.
        </p>

        <form class="shop-form" action="#" method="post">
            <div class="form-row">
                <label for="login-email">Электронная почта</label>
                <input id="login-email" name="email" type="email"
                       placeholder="Введите электронную почту" required>
            </div>

            <div class="form-row">
                <label for="login-password">Пароль</label>
                <input id="login-password" name="password" type="password"
                       placeholder="Введите пароль" minlength="6" required>
            </div>

            <label class="checkbox-row">
                <input type="checkbox" name="remember">
                <span>Запомнить меня</span>
            </label>

            <button class="button" type="submit">Войти</button>

            <p class="form-note">
                Нет аккаунта? <a href="registration.html">Зарегистрироваться</a>
            </p>
        </form>
    </main>

    <footer class="site-footer" id="site-footer">
        <p>&copy; <time datetime="2026">2026</time> «Мелодия». Учебный проект.</p>
        <address>
            Email: <a href="mailto:info@melody-shop.ru">info@melody-shop.ru</a><br>
            Телефон: <a href="tel:+79679124567">+7 (967) 912-45-67</a>
        </address>
    </footer>
</body>
</html>
